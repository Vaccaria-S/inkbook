<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>触摸交互 · 端到端</title>
    <link rel="stylesheet" href="/styles.css" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #f2f2f5;
      }
      #view-host {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }
      #out {
        position: absolute;
        left: 0;
        top: 0;
        z-index: 9999;
        width: 520px;
        max-height: 100%;
        overflow: auto;
        margin: 0;
        padding: 8px 10px;
        background: rgba(0, 0, 0, 0.82);
        color: #d8f5d8;
        font: 12px/1.5 ui-monospace, monospace;
        white-space: pre-wrap;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="view-host"></div>
    <pre id="out"></pre>
    <!--
      触摸桥：页面没法自己派发真实 TouchEvent
      （浏览器会强制类型转换，传普通对象会抛错）。
      这里通过 console.log 请求 Node 侧用 CDP 派发真实触摸，
      再由 Node 回传完成信号。

      这次要派发**多指**手势，所以接口收一组触点。
    -->
    <script>
      window.__cdpTouch = function (type, points) {
        return new Promise((resolve) => {
          const h = (e) => {
            if (e.source !== window) return;
            if (!e.data || e.data.__touchDone !== type) return;
            window.removeEventListener("message", h);
            resolve();
          };
          window.addEventListener("message", h);
          console.log(
            "__TOUCH__:" +
              type +
              ":" +
              points.map((p) => p.x + "," + p.y + "," + p.id).join(";")
          );
        });
      };
      window.__cdpReady = true;
    </script>
    <script src="/touch-harness.js"></script>
  </body>
</html>
