<!doctype html><html lang="zh"><head><meta charset="utf-8"><title>running</title>
<link rel="stylesheet" href="/styles.css">
<style>
html,body{margin:0;font-family:system-ui;background:#fff}
/*
 * 复刻 Obsidian 主题变量。
 * 不补这些变量时 `border: 1px solid var(--background-modifier-border)` 会
 * 因 "invalid at computed-value time" 退化成 border-style:none——量出来的
 * 尺寸就比真机宽 2px，正好把「边框吃掉 2px 内容宽」这个真实场景漏掉。
 */
:root{
  --background-primary:#fff;
  --background-primary-alt:#fafafa;
  --background-secondary:#f4f4f4;
  --background-modifier-border:#d9d9d9;
  --background-modifier-error:rgba(214,69,69,.12);
  --text-normal:#1a1a1a;
  --text-muted:#666;
  --text-faint:#999;
  --text-error:#d64545;
  --text-on-accent:#fff;
  --interactive-accent:#6c5ce7;
}
/*
 * 几何测量区：横排、顶部对齐。
 * 窄栏（90/92/300）一行放得下；800px 那一轮单独跑，跑完就清空。
 */
#geo{display:flex;align-items:flex-start;gap:6px;padding:4px;box-sizing:border-box;min-height:40px}
#geo > .cell{min-width:0}
/* 模拟 Obsidian 主题里常见的全局 box-sizing reset，用来对比两种宿主的量法 */
#geo.bb, #geo.bb *{box-sizing:border-box}
#leak-host,#big-host{display:block;height:1px;overflow:hidden}
#fail-host,#idem-host{display:flex;align-items:flex-start;gap:6px;padding:4px;box-sizing:border-box}
#fail-host > .cell,#idem-host > .cell{min-width:0}
#out{position:fixed;left:0;bottom:0;width:100%;max-height:46vh;overflow:auto;z-index:9999;background:#111;color:#0f0;font-size:12px;padding:6px;margin:0;white-space:pre-wrap}
</style></head><body>
<div id="geo"></div>
<div id="fail-host"></div>
<div id="idem-host"></div>
<div id="leak-host"></div>
<div id="big-host"></div>
<pre id="out">running…</pre>
<script type="module" src="/qa-embed2-harness.js"></script></body></html>
