<!doctype html><html lang="zh"><head><meta charset="utf-8"><title>running</title>
<link rel="stylesheet" href="/styles.css">
<style>
html,body{margin:0;font-family:system-ui;background:#fff}
/*
 * 复刻 Obsidian 的主题变量。缺了它们 `border: 1px solid var(--x)` 会整条失效、
 * 边框变 0px —— 那正是上一轮「不越栏」假绿的成因，所以这里**必须**先补齐。
 * 2b 那一段另起一个 iframe 专门验"没有变量"的宿主。
 */
:root{
  --background-primary:#fff;
  --background-primary-alt:#fafafa;
  --background-secondary:#f4f4f4;
  --background-modifier-border:#d9d9d9;
  --background-modifier-error:rgba(214,69,69,.12);
  --text-normal:#1a1a1a;
  --text-muted:#666;
  --text-faint:#999;
  --text-error:#d64545;
  --text-on-accent:#fff;
  --text-warning:#b7791f;
  --interactive-accent:#6c5ce7;
}
/*
 * 所有夹具叠在左上角、各自 fixed：每段跑完才轮到下一段，坐标系互不影响。
 * 只有 #far-host 必须真的在 6000px 之外（验"视口外不重画"）。
 */
#w-host,#geo-host,#click-host,#refresh-host,#conc-host,#leak-host,#badge-host{
  position:fixed;left:0;top:0;display:flex;align-items:flex-start;gap:6px
}
#w-host{width:320px}
#geo-host{width:200px;box-sizing:content-box}
#click-host{width:320px}
#refresh-host{width:480px;flex-wrap:wrap}
#conc-host{width:220px}
#leak-host{width:240px}
#badge-host{width:420px}
#far-host{position:absolute;left:0;top:6000px;width:200px;display:block}
#out{position:fixed;left:0;bottom:0;width:100%;max-height:40vh;overflow:auto;z-index:99999;background:#111;color:#0f0;font-size:12px;padding:6px;margin:0;white-space:pre-wrap}
</style></head><body>
<div id="w-host"></div>
<div id="geo-host"></div>
<div id="click-host"></div>
<div id="refresh-host"></div>
<div id="conc-host"></div>
<div id="leak-host"></div>
<div id="badge-host"></div>
<div id="far-host"></div>
<pre id="out">running…</pre>
<script type="module" src="/qa-embed4-harness.js"></script></body></html>
