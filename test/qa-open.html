<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>QA 独立验证：打开 300+ 页（占位生命周期 / 二次打开 / 失败路径）</title>
    <link rel="stylesheet" href="/styles.css" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
      }
      #view-host {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }
      #out {
        position: fixed;
        left: 0;
        bottom: 0;
        max-height: 42%;
        overflow: auto;
        width: 100%;
        margin: 0;
        padding: 6px 8px;
        font: 11px/1.45 ui-monospace, Consolas, monospace;
        background: #0b0b0bdd;
        color: #e8e8e8;
        white-space: pre-wrap;
        z-index: 99999;
      }
    </style>
  </head>
  <body>
    <div id="view-host"></div>
    <pre id="out"></pre>
    <script src="/qa-open-harness.js"></script>
  </body>
</html>
