<!doctype html><html lang="zh"><head><meta charset="utf-8"><title>running</title>
<link rel="stylesheet" href="/styles.css">
<style>
html,body{margin:0;font-family:system-ui;background:#fff}
:root{
  --background-primary:#fff;--background-primary-alt:#fafafa;--background-secondary:#f4f4f4;
  --background-modifier-border:#d9d9d9;--background-modifier-error:rgba(214,69,69,.12);
  --text-normal:#1a1a1a;--text-muted:#666;--text-faint:#999;--text-error:#d64545;
  --text-on-accent:#fff;--text-warning:#b7791f;--interactive-accent:#6c5ce7;
}
/*
 * 1200px 宽的栏：模拟 Retina 上最大化后的阅读面板（比 840 上限宽）。
 * 每个 case 都叠在同一个位置（position:fixed），这样四个都在视口里——
 * 排在下面的话，懒加载观察器不会画，量出来只有第一块。
 */
#wide-host{position:fixed;left:0;top:0;width:1200px;display:block}
.case{position:fixed;left:0;top:0;width:1200px;display:block}
#out{position:fixed;left:0;bottom:0;width:100%;max-height:60vh;overflow:auto;z-index:99999;background:#111;color:#0f0;font-size:12px;padding:6px;margin:0;white-space:pre-wrap}
</style></head><body>
<div id="wide-host"></div>
<pre id="out">running…</pre>
<script type="module" src="/qa-dprcheck-harness.js"></script></body></html>
