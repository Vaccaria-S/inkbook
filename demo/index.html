<!doctype html>
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>墨本 Inkbook · 手感测试</title>
    <link rel="stylesheet" href="/styles.css" />
    <style>
      :root {
        --background-primary: #ffffff;
        --background-secondary: #f4f4f5;
        --background-primary-alt: #fafafa;
        --text-normal: #222222;
        --text-muted: #666666;
        --text-faint: #9a9a9a;
        --text-error: #d64545;
        --text-warning: #b07d1f;
        --text-on-accent: #ffffff;
        --background-modifier-border: #e3e3e6;
        --background-modifier-hover: rgba(0, 0, 0, 0.06);
        --interactive-accent: #6c5ce7;
        --interactive-accent-hover: #5a4bd1;
        --radius-s: 4px;
        --radius-m: 6px;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
        color: var(--text-normal);
        background: #e9e9ec;
      }
      #demo-top {
        height: 46px;
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 0 10px;
        background: #fff;
        border-bottom: 1px solid #ddd;
        font-size: 12px;
      }
      #demo-top .brand { font-weight: 600; margin-right: 8px; }
      #app { height: calc(100vh - 46px); display: flex; }
      .demo-hint { margin-left: auto; color: #999; font-size: 11px; }
      #demo-top .mb-btn { white-space: nowrap; padding: 0 8px; }
      .mb-range { width: 100px; }
    </style>
  </head>
  <body>
    <div id="demo-top">
      <span class="brand">墨本 Inkbook</span>
      <button class="mb-btn" id="t-pen" title="钢笔 P"><span>钢笔</span></button>
      <button class="mb-btn" id="t-ball" title="圆珠笔 B"><span>圆珠</span></button>
      <button class="mb-btn" id="t-hl" title="荧光笔 H"><span>荧光</span></button>
      <button class="mb-btn" id="t-eraser" title="橡皮 E"><span>橡皮</span></button>
      <button class="mb-btn" id="t-lasso" title="套索 L"><span>套索</span></button>
      <button class="mb-btn" id="t-shape" title="形状 R"><span>形状</span></button>
      <button class="mb-btn" id="t-hand" title="拖动画布"><span>手</span></button>
      <div class="mb-sep"></div>
      <div class="mb-colors" id="colors"></div>
      <div class="mb-sep"></div>
      <input class="mb-range" id="size" type="range" min="1" max="8" step="0.1" value="2.8" />
      <span class="mb-size-lbl" id="size-lbl">2.8</span>
      <div class="mb-sep"></div>
      <button class="mb-btn" id="undo" title="撤销"><span>↶</span></button>
      <button class="mb-btn" id="redo" title="重做"><span>↷</span></button>
      <div class="mb-sep"></div>
      <select id="tpl" class="dropdown"></select>
      <button class="mb-btn" id="add" title="加一页"><span>＋页</span></button>
      <button class="mb-btn" id="fit" title="整页适应"><span>适应</span></button>
      <button class="mb-btn" id="zoomout" title="缩小"><span>－</span></button>
      <span class="mb-size-lbl" id="zoom">0%</span>
      <button class="mb-btn" id="zoomin" title="放大"><span>＋</span></button>
      <span class="demo-hint">鼠标也能写；接上数位笔有压感。这是插件内核的浏览器预览。</span>
    </div>
    <div id="app"></div>
    <script type="module" src="/demo.js"></script>
  </body>
</html>
